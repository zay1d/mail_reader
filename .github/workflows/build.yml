name: Сборка ReceptionMail

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости сборки
        run: pip install -r build_tools/requirements.txt

      - name: Тесты
        run: python -m unittest discover -s tests

      - name: Сборка ReceptionMail.exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name ReceptionMail --paths app --distpath build_out --workpath build_tmp --specpath build_tmp app/main.py

      - name: Папки установки и обновления
        shell: bash
        run: echo "VERSION=$(python build_tools/make_package.py build_out/ReceptionMail.exe dist_pkg)" >> "$GITHUB_ENV"

      - name: Пробный запуск exe в демо-режиме
        run: python build_tools/smoke_test.py dist_pkg/install

      - name: Архив установки
        uses: actions/upload-artifact@v4
        with:
          name: reception-mail_install_v${{ env.VERSION }}
          path: dist_pkg/install
          include-hidden-files: true
          if-no-files-found: error

      - name: Архив обновления
        uses: actions/upload-artifact@v4
        with:
          name: reception-mail_update_v${{ env.VERSION }}
          path: dist_pkg/update
          if-no-files-found: error
